name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck --severity=warning scripts.sh install.sh uninstall.sh lang/*.sh tools/*.sh tests/*.sh

      - name: Tests
        run: bash tests/run.sh
